name: bookipi-flash-sale

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-flashsale}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Host-mapped so local `npm run dev` backends (DATABASE_URL default
      # ...@localhost:5432/...) and host-side psql/k6 can reach PG without
      # entering the compose network. Compose backends keep using
      # postgres:5432 via DATABASE_URL.
      - "5432:5432"
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@postgres:5432/flashsale}
      PORT: ${PORT:-3001}
      SALE_START: ${SALE_START:-}
      SALE_END: ${SALE_END:-}
      STOCK_QTY: ${STOCK_QTY:-100}
      RATE_LIMIT_BUY: ${RATE_LIMIT_BUY:-10}
      PG_POOL_MAX: ${PG_POOL_MAX:-50}
      # Only set TRUST_PROXY=1 when a trusted proxy/LB actually fronts the
      # backend; default off so X-Forwarded-For cannot spoof the rate-limit key.
      TRUST_PROXY: ${TRUST_PROXY:-0}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
      # Vite bakes VITE_API_URL into the bundle at build time, so it is a
      # build arg (not runtime env): browsers open the SPA but call the
      # backend directly at this absolute URL.
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_started

volumes:
  pgdata:
